
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: demohello-monitor
  namespace: monitoring
  labels:
    release: prometheus
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: demohello
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
